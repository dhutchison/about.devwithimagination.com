bio: |+
  I am a DevOps Architect and Software Development Lead based in central Scotland.

  I like building things — from software to the platforms and automation to help teams deliver and maintain it. My background started in Java development and has grown to include cloud platforms, CI/CD, Python, Linux systems, and a fair bit of architectural problem-solving along the way.

  In my spare time I tinker with other technologies, which sometimes turn into blog posts.

  Away from the screen I enjoy spending time with my family and skating.

